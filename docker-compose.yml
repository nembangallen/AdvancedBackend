version: "3.9"

services:
  app:
    build: .
    container_name: auth_app
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      MONGO_URI: mongodb://mongo:27017/auth_db
      JWT_ACCESS_SECRET: 112c4fafdf1938ac85dd436063add993423278befe9dd4f2a7c70c654249f19c
      JWT_REFRESH_SECRET: 1932fd5e33023fbca67f1b850ff3f32ab5cfae34bd9e4c10232a5df738807274
      ACCESS_TOKEN_TTL: 15m
      REFRESH_TOKEN_TTL: 7d
      COOKIE_SECURE: "false"
    depends_on:
      - mongo

  mongo:
    image: mongo:7
    container_name: auth_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
